name: Diagnose official libvpx archive hashes
on: create
permissions:
  contents: read
jobs:
  probe:
    if: github.event.ref == 'ops/probe-libvpx-2026-11-08'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Compare official archive routes without accepting mismatches
        shell: python
        run: |
          import urllib.request, hashlib
          for u in [
            "https://github.com/webmproject/libvpx/archive/v1.15.2.tar.gz",
            "https://codeload.github.com/webmproject/libvpx/tar.gz/v1.15.2",
            "https://codeload.github.com/webmproject/libvpx/tar.gz/refs/tags/v1.15.2",
            "https://api.github.com/repos/webmproject/libvpx/tarball/v1.15.2",
            "https://codeload.github.com/webmproject/libvpx/legacy.tar.gz/refs/tags/v1.15.2"
          ]:
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"rustdesk-archive-diagnostic"}), timeout=60) as r:
                      b=r.read()
                      print(u, "status", r.status, "type", r.headers.get("Content-Type"), "bytes",len(b),"SHA512",hashlib.sha512(b).hexdigest(),"magic",b[:20].hex(),"final",r.url,flush=True)
              except Exception as e:
                  print(u,str(e),flush=True)
