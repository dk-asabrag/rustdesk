name: Verify owner-configured fork signing key
on: create
permissions:
  contents: read
jobs:
  verify-key:
    if: github.repository == 'dk-asabrag/rustdesk' && github.event.ref == 'ops/verify-fork-signing-key-2026-11-08' && github.event.sender.login == 'dk-asabrag'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: b3d92d42a875adacf278e72252930a692a9a037d
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'
      - name: Verify private seed matches the configured client public key
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.RUSTDESK_UPDATE_ED25519_PUBLIC_KEY }}
          EXPECTED_PUBLIC_KEY: "Di++FkFosatJ6QhkZb0COefAtJBvjmGDK4Za+A69AFE="
        run: |
          python res/update/check_fork_update_key.py
          python -c 'import os; assert os.environ["RUSTDESK_UPDATE_ED25519_PUBLIC_KEY"] == os.environ["EXPECTED_PUBLIC_KEY"], "Public key changed"'
