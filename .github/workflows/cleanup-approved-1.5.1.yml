name: Remove explicitly approved replaced RustDesk releases
on: create
permissions:
  contents: write
jobs:
  cleanup-approved-releases:
    if: github.repository == 'dk-asabrag/rustdesk' && github.event.ref_type == 'branch' && github.event.ref == 'ops/cleanup-approved-1.5.1-2026-11-08' && github.event.sender.login == 'dk-asabrag'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Verify published replacement, backups and exact asset identities before approved deletion
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            const {owner,repo}=context.repo;
            if(owner!=='dk-asabrag'||repo!=='rustdesk') throw new Error('Unexpected repository');
            const source='e7829a52b639d95eda2f6f541566efadecd8721a';
            const removeAbandoned=true;
            const current=(await github.rest.repos.getRelease({owner,repo,release_id:437518085})).data;
            if(current.draft||current.prerelease||current.tag_name!=='1.5.1'||current.target_commitish!==source) throw new Error('Replacement not published correctly');
            const commit=(await github.rest.repos.getCommit({owner,repo,ref:'1.5.1'})).data;
            if(commit.sha!==source) throw new Error('Replacement tag differs');
            const expectedNames=["rustdesk-1.5.1-0-x86_64.pkg.tar.zst","rustdesk-1.5.1-0.aarch64-suse.rpm","rustdesk-1.5.1-0.aarch64.rpm","rustdesk-1.5.1-0.x86_64-suse.rpm","rustdesk-1.5.1-0.x86_64.rpm","rustdesk-1.5.1-aarch64.apk","rustdesk-1.5.1-aarch64.AppImage","rustdesk-1.5.1-aarch64.deb","rustdesk-1.5.1-aarch64.dmg","rustdesk-1.5.1-aarch64.exe","rustdesk-1.5.1-aarch64.flatpak","rustdesk-1.5.1-aarch64.msi","rustdesk-1.5.1-armv7-sciter.deb","rustdesk-1.5.1-armv7.apk","rustdesk-1.5.1-universal.apk","rustdesk-1.5.1-x86-sciter.exe","rustdesk-1.5.1-x86_64-sciter.deb","rustdesk-1.5.1-x86_64-sciter.flatpak","rustdesk-1.5.1-x86_64.apk","rustdesk-1.5.1-x86_64.AppImage","rustdesk-1.5.1-x86_64.deb","rustdesk-1.5.1-x86_64.exe","rustdesk-1.5.1-x86_64.flatpak","rustdesk-1.5.1-x86_64.msi","rustdesk-unattended-wayland-1.5.1-x86_64.deb","rustdesk.sbom.json"];
            const fresh=await github.paginate(github.rest.repos.listReleaseAssets,{owner,repo,release_id:437518085,per_page:100});
            if(fresh.length!==26||expectedNames.some(n=>!fresh.some(a=>a.name===n&&a.state==='uploaded'&&a.size>0&&/^sha256:[a-f0-9]{64}$/.test(a.digest||'')))) throw new Error('Replacement assets incomplete');
            const backup=(await github.rest.git.getRef({owner,repo,ref:'heads/backup/pre-1.5.1-refresh-2026-11-07'})).data;
            const oldTag=(await github.rest.git.getRef({owner,repo,ref:'tags/master'})).data;
            if(backup.object.sha!=='e329d795360a79bf64fc1d22920aafb5ec9c4ea9'||oldTag.object.sha!=='e329d795360a79bf64fc1d22920aafb5ec9c4ea9') throw new Error('Backup or legacy source differs');
            const fingerprint=assets=>assets.map(({id,name,size,digest})=>({id,name,size,digest})).sort((a,b)=>a.id-b.id);
            const targets=[{id:410710932,tag:'master',draft:false,assets:[{"id":708822123,"name":"rustdesk.sbom.json","size":1865772,"digest":"sha256:8c421b09ed5f953335a1ca6f7f05d2777542ab204473705d86c918fc63875a7f"},{"id":708890569,"name":"rustdesk-1.5.1-0.x86_64.rpm","size":34346708,"digest":"sha256:243090c4a781762f3b8d1768b14daf0ddae70dda88bd0fd401cbb8da0ce2f8c5"},{"id":708890573,"name":"rustdesk-1.5.1-0.x86_64-suse.rpm","size":34346780,"digest":"sha256:7be1bfbb108334b25880ca1b353430744689d2ec6dac49eed0e5a0e8a03ea059"},{"id":708890576,"name":"rustdesk-1.5.1-x86_64.deb","size":25333956,"digest":"sha256:d6bc3e75c0b8ef6d610152a91732da83517e82d9933e833b688fa0767b4844df"},{"id":708892767,"name":"rustdesk-1.5.1-x86_64-sciter.deb","size":18349188,"digest":"sha256:bc611a4a87047d40bb8d67b20828418ca430a22014170dc737567219e4d6981d"},{"id":708892939,"name":"rustdesk-1.5.1-0-x86_64.pkg.tar.zst","size":27260397,"digest":"sha256:ec54ba3c48616da1cff7113859d58eafdc260bf9e3aba4a63323f69c07b0179c"},{"id":708920226,"name":"rustdesk-1.5.1-x86_64.apk","size":28786138,"digest":"sha256:d0ba46c54c9c25f8c4d962670186a0c3161b467eca7d3a414d1dfca637c30b57"},{"id":708924002,"name":"rustdesk-1.5.1-aarch64.dmg","size":30445866,"digest":"sha256:fe0b484ed88472055bbe5a6e70a8501a13794737166c45389a8b1225a0851d3a"},{"id":708925359,"name":"rustdesk-1.5.1-aarch64.deb","size":23590808,"digest":"sha256:5fae9e8d9e5eeacb9268f1150af06d251c0b082e5b32186d8b78713e56dfed9f"},{"id":708925361,"name":"rustdesk-1.5.1-0.aarch64-suse.rpm","size":33529935,"digest":"sha256:94c7590388123b94a459df9d49318de53548c6bbe8597bc06a5b348a58dc4486"},{"id":708925366,"name":"rustdesk-1.5.1-0.aarch64.rpm","size":33529861,"digest":"sha256:a504dd2164bbf1f6e23341c3370a09329d239c58347d552b3407aab243ebe099"},{"id":708925926,"name":"rustdesk-1.5.1-aarch64.apk","size":29265132,"digest":"sha256:97852cb75d8a4e6717c3bab9a45f27648d5a12404e53cc0293e2fa046b2fc3df"},{"id":708926731,"name":"rustdesk-1.5.1-x86-sciter.exe","size":13612032,"digest":"sha256:7036f55258aaeacfd018450d077e3299ef41f4e4513dd405a6550801a9c74b78"},{"id":708929744,"name":"rustdesk-1.5.1-x86_64.AppImage","size":88472056,"digest":"sha256:2ec558716478cf302a42b97fc154fd62b9cd1ef5267e2d2c2d2fa1c94c7f127c"},{"id":708929915,"name":"rustdesk-1.5.1-aarch64.AppImage","size":80337416,"digest":"sha256:d48b3373fdc8b86a0cd86c4ac0a171d0f8de6f92286c636fe8536786816b9fe4"},{"id":708931783,"name":"rustdesk-1.5.1-armv7.apk","size":27679880,"digest":"sha256:83753f62bc1216e7b589a5895cc49a775b7cce959c0f87d27268576845ceaf26"},{"id":708953070,"name":"rustdesk-unattended-wayland-1.5.1-x86_64.deb","size":25589892,"digest":"sha256:1b0b962c88c648fafe1786554ef130c56a376d79233ec0104b3e28faf7f2c5ff"},{"id":708963357,"name":"rustdesk-1.5.1-universal.apk","size":78932209,"digest":"sha256:3f72b9faabffec57aa04d2f48a234321dbb7bd0ba896e753b37df404d8b482b6"},{"id":708975690,"name":"rustdesk-1.5.1-x86_64.msi","size":26657269,"digest":"sha256:d072c3bc64a785469788c95e3aceb4fcdbdb17f00835e4296ce6e8e0b16b23fe"},{"id":708975691,"name":"rustdesk-1.5.1-x86_64.exe","size":26097152,"digest":"sha256:3ee7e9e744b52179b0b6ac484c6ff5108057760c8d787770c2c8589edd9d2f00"},{"id":708981618,"name":"rustdesk-1.5.1-aarch64.msi","size":24797792,"digest":"sha256:dc85dbf1ce139ddfbbe16c51d3d8d8a1684726a2c168dcb5b8d5f9863bd7cbd8"},{"id":708981634,"name":"rustdesk-1.5.1-aarch64.exe","size":24137728,"digest":"sha256:1b60219ddcceeddd2de6bfe42d62f2dedec0d3eccd7c84fd3293fb01c72863c3"},{"id":709014094,"name":"rustdesk-1.5.1-x86_64.dmg","size":37447383,"digest":"sha256:e003aea5967863d41b4614b0759ffcc190c5091ba27cf4041389597a4dfa0188"},{"id":709024715,"name":"rustdesk-1.5.1-unsigned.tar.gz","size":205014077,"digest":"sha256:9b0e31016bd125f4435351840c35a823e40dfa23668daa0301ae00923f2ec911"},{"id":709028956,"name":"rustdesk-1.5.1-armv7-sciter.deb","size":15233896,"digest":"sha256:27a197dad9daef5b0eee75c4f403bb9cac8b189b1918c2ba908c8d6eec3e1c9c"},{"id":709036152,"name":"rustdesk-1.5.1-x86_64-sciter.flatpak","size":18203064,"digest":"sha256:ade0ebc30977b504aa6c65ba4e489dc547977222430c710785a29b430c84a6ad"},{"id":709048380,"name":"rustdesk-1.5.1-aarch64.flatpak","size":23495992,"digest":"sha256:187da90969ba480bfdadc1924a40c425078f87c5a0dba58c262364d8040e32d9"},{"id":709060482,"name":"rustdesk-1.5.1-x86_64.flatpak","size":25159192,"digest":"sha256:633258ef8ba892d5c155f76c79f55005061bfa189ce6295458aae759cd4e2274"}]}];
            if(removeAbandoned) targets.push({id:437501843,tag:"untagged-ebc377f870a98575425a",draft:true,assets:[{"id":720369015,"name":"rustdesk.sbom.json","size":1865772,"digest":"sha256:10639b5991ec6bf5b98724c64008abfc527ad2032ca2d61ebeaba543b851baec"},{"id":720433008,"name":"rustdesk-1.5.1-x86-sciter.exe","size":13620224,"digest":"sha256:a0c8300b98ddada4fead93a7b6efa6aa0dd17a87c94719bc345df5bab36593d2"}]});
            for(const target of targets){
              let release;
              try{release=(await github.rest.repos.getRelease({owner,repo,release_id:target.id})).data;}
              catch(e){if(e.status===404){core.info('Already absent: '+target.id);continue;}throw e;}
              if(release.tag_name!==target.tag||release.draft!==target.draft) throw new Error('Release identity changed: '+target.id);
              const assets=await github.paginate(github.rest.repos.listReleaseAssets,{owner,repo,release_id:target.id,per_page:100});
              if(JSON.stringify(fingerprint(assets))!==JSON.stringify(target.assets)) throw new Error('Release assets changed: '+target.id);
            }
            for(const target of targets){
              try{await github.rest.repos.deleteRelease({owner,repo,release_id:target.id});}
              catch(e){if(e.status!==404)throw e;}
              let absent=false;
              try{await github.rest.repos.getRelease({owner,repo,release_id:target.id});}
              catch(e){if(e.status===404)absent=true;else throw e;}
              if(!absent) throw new Error('Deletion not verified: '+target.id);
            }
            await core.summary.addHeading('Confirmed release cleanup completed')
            .addRaw('Published replacement: '+current.html_url+'\n\n')
            .addRaw('Deleted only the explicitly approved release IDs. Git tags and backup branches were retained.\n').write();
