name: Fork automatic update checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned signing dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'
      - name: Check the diff and update signing tests
        run: |
          git diff --check HEAD^ HEAD
          python -m unittest res/update/test_generate_update_metadata.py res/update/test_update_metadata_cli.py res/update/test_macos_update_scripts.py res/update/test_fork_update_metadata.py
      - name: Audit existing automatic update entry points
        run: rg -n 'start_auto_update|OPTION_ALLOW_AUTO_UPDATE' src || test "$?" -eq 1
