name: Validate pending-draft signing correction
on: create
permissions:
  contents: write
jobs:
  validate-signer:
    if: github.repository == 'dk-asabrag/rustdesk' && github.event.ref == 'ops/validate-draft-signer-1.5.2-2026-11-08' && github.event.sender.login == 'dk-asabrag'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 32226132075ed5e5fc85ad8397f4ef737e3b87c8
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'
      - name: Validate signing tools and pending-draft regression
        run: |
          git diff --check HEAD^ HEAD
          python -m compileall -q res/update
          python -m unittest res/update/test_generate_update_metadata.py res/update/test_update_metadata_cli.py res/update/test_macos_update_scripts.py res/update/test_fork_update_metadata.py
      - name: Verify the actual unpublished draft lookup without modifying it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "res/update")
          from publish_fork_update_metadata import release_for_tag
          release = release_for_tag("1.5.2")
          assert release["id"] == 438494334 and release["draft"]
          assert release["target_commitish"] == "b3d92d42a875adacf278e72252930a692a9a037d"
          print("Unpublished 1.5.2 draft found by exact ID; client source unchanged.")
          PY
